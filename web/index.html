    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03050c" />
    <meta name="color-scheme" content="dark" />
    <title>FERNO DESK · PERP RESEARCH</title>
    <meta
      name="description"
      content="Read-only Hyperliquid research desk: wallet screening, funding carry and a size ladder."

      type="image/svg+xml"

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"

    <!-- TradingView's open-source engine, same renderer AI-Crypto-Trader uses.
         Pinned to 4.x: 5.x moved to addSeries(CandlestickSeries) and would need a rewrite. -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <!-- background layers (fire.js binds to window, canvases never take clicks) -->
    <canvas id="fire" aria-hidden="true"></canvas>
    <canvas id="embers" aria-hidden="true"></canvas>
    <div class="fx scanlines" aria-hidden="true"></div>
    <div class="fx vignette" aria-hidden="true"></div>
    <div class="fx grain" aria-hidden="true"></div>
    <div class="fx bluewash" aria-hidden="true"></div>

    <div id="root"></div>
    <noscript>This cockpit needs JavaScript and WebGL.</noscript>

    <script type="module" src="/vendor/fire.js"></script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
